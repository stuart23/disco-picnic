name: Terraform Apply

# Runs on every merge to main, and can also be triggered manually.
on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch: {}

# id-token: write is required for AWS OIDC role assumption (no stored keys).
permissions:
  id-token: write
  contents: read

# Prevent two applies from racing each other; the S3 backend's DynamoDB
# lock would block the second one anyway, but this avoids a failed/retried
# run instead of a queued one.
concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          # Accepts the role ARN whether it was saved as an Actions
          # Variable or a Secret (README previously said either was fine —
          # this covers both so a "Could not load credentials" failure
          # can't come down to which tab you pasted it into).
          role-to-assume: ${{ vars.AWS_GITHUB_ACTIONS_ROLE_ARN || secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan
        env:
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
        env:
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}
