    /* This CSS rule is applied to all div elements in the leafContainer div.
       It styles and animates each leafDiv.
    */
    #leafContainer > div
    {
        position: absolute;
        width: 100px;
        height: 100px;

        /* We use the following properties to apply the fade and drop animations to each leaf.
           Each of these properties takes two values. These values respectively match a setting
           for fade and drop.
        */
        -webkit-animation-iteration-count: infinite, infinite;
        -webkit-animation-direction: normal, normal;
        -webkit-animation-timing-function: linear, ease-in;
    }

    /* This CSS rule is applied to all img elements directly inside div elements which are
       directly inside the leafContainer div. In other words, it matches the 'img' elements
       inside the leafDivs which are created in the createALeaf() function.
    */
    #leafContainer > div > img {
         position: absolute;
         width: 100px;
         height: 100px;

        /* We use the following properties to adjust the clockwiseSpin or counterclockwiseSpinAndFlip
           animations on each leaf.
           The createALeaf function in the Leaves.js file determines whether a leaf has the
           clockwiseSpin or counterclockwiseSpinAndFlip animation.
        */
         -webkit-animation-iteration-count: infinite;
         -webkit-animation-direction: alternate;
         -webkit-animation-timing-function: ease-in-out;
         -webkit-transform-origin: 50% -100%;
    }


    /* Hides a leaf towards the very end of the animation */
    @-webkit-keyframes fade
    {
        /* Show a leaf while into or below 95 percent of the animation and hide it, otherwise */
        0%   { opacity: 1; }
        95%  { opacity: 1; }
        100% { opacity: 0; }
    }


    /* Makes a leaf fall from -300 to 600 pixels in the y-axis */
    @-webkit-keyframes drop
    {
        /* Move a leaf to -300 pixels in the y-axis at the start of the animation */
        0%   { -webkit-transform: translate(0px, -50px); }
        /* Move a leaf to 600 pixels in the y-axis at the end of the animation */
        100% { -webkit-transform: translate(0px, 1000px); }
    }

    /* Rotates a leaf from -50 to 50 degrees in 2D space */
    @-webkit-keyframes clockwiseSpin
    {
        /* Rotate a leaf by -50 degrees in 2D space at the start of the animation */
        0%   { -webkit-transform: rotate(-50deg); }
        /*  Rotate a leaf by 50 degrees in 2D space at the end of the animation */
        100% { -webkit-transform: rotate(50deg); }
    }


    /* Flips a leaf and rotates it from 50 to -50 degrees in 2D space */
    @-webkit-keyframes counterclockwiseSpinAndFlip
    {
        /* Flip a leaf and rotate it by 50 degrees in 2D space at the start of the animation */
        0%   { -webkit-transform: scale(-1, 1) rotate(50deg); }
        /* Flip a leaf and rotate it by -50 degrees in 2D space at the end of the animation */
        100% { -webkit-transform: scale(-1, 1) rotate(-50deg); }
    }

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import WebGL from 'three/addons/capabilities/WebGL.js';
    var mesh, renderer, scene, camera;

    if ( WebGL.isWebGL2Available() ) {
      init();
      render();
    } else {
      document.body.appendChild( WebGL.getWebGL2ErrorMessage() );
    }

    function init() {
      scene = new THREE.Scene();
			scene.background = new THREE.Color( 0xffffff );

      // Create our own canvas up front and hand it to the renderer
      // explicitly, instead of letting THREE.WebGLRenderer() create one
      // implicitly. Some browser engines will refuse a context request on
      // THREE's implicitly-created canvas with "Canvas has an existing
      // context of a different type" if anything else touches that canvas
      // first (e.g. a screenshot/thumbnailing tool); owning canvas creation
      // ourselves avoids that race, and the try/catch gives a visible
      // failure instead of a silently blank scene either way.
      var canvasEl = document.createElement( 'canvas' );
      document.body.appendChild( canvasEl );

      try {
        renderer = new THREE.WebGLRenderer( { canvas: canvasEl, antialias: true } );
      } catch ( error ) {
        console.error( 'THREE.WebGLRenderer failed to initialize:', error );
        canvasEl.remove();
        document.body.appendChild( WebGL.getWebGL2ErrorMessage() );
        return;
      }
			renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );

      var lights = [];
      lights[ 0 ] = new THREE.PointLight( 0xffffff, 1, 0 );
      lights[ 1 ] = new THREE.PointLight( 0xffffff, 1, 0 );
      lights[ 2 ] = new THREE.PointLight( 0xffffff, 1, 0 );

      lights[ 0 ].position.set( 0, 200, 0 );
      lights[ 1 ].position.set( 100, 200, 100 );
      lights[ 2 ].position.set( - 100, - 200, - 100 );

      scene.add( lights[ 0 ] );
      scene.add( lights[ 1 ] );
      scene.add( lights[ 2 ] );

      camera = new THREE.PerspectiveCamera( 60, window.innerWidth / window.innerHeight, 1, 1000 );
      camera.position.set( 10, 15, 25 );
      camera.setViewOffset(window.innerWidth, window.innerHeight, window.innerWidth/3, -window.innerHeight/4, window.innerWidth, window.innerHeight)
      // camera.filmOffset = 0.3 * camera.getFilmWidth();

      camera.updateProjectionMatrix();

      scene.add( camera );
      var controls = new OrbitControls( camera, renderer.domElement );
      controls.addEventListener( 'change', render );

      const radius = 12;
      const widthSegments = 24;
      const heightSegments = 16;
      const sphereGeometry = new THREE.SphereGeometry(radius, widthSegments, heightSegments);
      // const geometry = new THREE.BufferGeometry().fromGeometry( sphereGeometry );

      var picture_array = [
        "AM.png",
        "CN.png",
        "DS.png",
        "KM.png",
        "KS.png",
        "KT.png",
        "db.jpg",
        "dq.png",
        "gt.png",
        "km.jpg",
        "ok.jpg",
        "pk.png",
        "sb.png",
        "rn.jpg"
      ];

      var random_pic = picture_array[Math.floor(Math.random()*picture_array.length)];
      var pic_url = random_pic; // relative to the page's own origin
      console.log("Pic = ", pic_url);
      var texture = new THREE.TextureLoader().load(
        pic_url,
        render,
        undefined,
        function onTextureError( error ) {
          console.error( 'Failed to load texture', pic_url, error );
        }
      );
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set( 24, 16 );
      var material = new THREE.MeshPhongMaterial( { map: texture, emissive: 0x000000, flatShading: false } );
      var sphere = new THREE.Mesh( sphereGeometry, material );
      scene.add( sphere );
      window.addEventListener( 'resize', onWindowResize, false );
    }
    function render() {
      renderer.render( scene, camera );
    }
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize( window.innerWidth, window.innerHeight );
      render();
    }
  </script>
  <script>
    /* Define the number of leaves to be used in the animation */
    const NUMBER_OF_LEAVES = 30;

    /*
        Called when the "Falling Leaves" page is completely loaded.
    */
    function initLeaves()
    {
        /* Get a reference to the element that will contain the leaves */
        var container = document.getElementById('leafContainer');
        /* Fill the empty container with new leaves */
        for (var i = 0; i < NUMBER_OF_LEAVES; i++)
        {
            container.appendChild(createALeaf());
        }
    }


    /*
        Receives the lowest and highest values of a range and
        returns a random integer that falls within that range.
    */
    function randomInteger(low, high)
    {
        return low + Math.floor(Math.random() * (high - low));
    }


    /*
       Receives the lowest and highest values of a range and
       returns a random float that falls within that range.
    */
    function randomFloat(low, high)
    {
        return low + Math.random() * (high - low);
    }


    /*
        Receives a number and returns its CSS pixel value.
    */
    function pixelValue(value)
    {
        return value + 'px';
    }


    /*
        Returns a duration value for the falling animation.
    */

    function durationValue(value)
    {
        return value + 's';
    }


    /*
        Uses an img element to create each leaf. "Leaves.css" implements two spin
        animations for the leaves: clockwiseSpin and counterclockwiseSpinAndFlip. This
        function determines which of these spin animations should be applied to each leaf.

    */
    function createALeaf()
    {
        /* Start by creating a wrapper div, and an empty img element */
        var leafDiv = document.createElement('div');
        var image = document.createElement('img');

        /* Randomly choose a leaf image and assign it to the newly created element */
        image.src = 'table.png';

        leafDiv.style.top = "-100px";

        /* Position the leaf at a random location along the screen */
        leafDiv.style.left = pixelValue(randomInteger(0, 500));

        /* Randomly choose a spin animation */
        var spinAnimationName = (Math.random() < 0.5) ? 'clockwiseSpin' : 'counterclockwiseSpinAndFlip';

        /* Set the -webkit-animation-name property with these values */
        leafDiv.style.webkitAnimationName = 'fade, drop';
        image.style.webkitAnimationName = spinAnimationName;

        /* Figure out a random duration for the fade and drop animations */
        var fadeAndDropDuration = durationValue(randomFloat(5, 11));

        /* Figure out another random duration for the spin animation */
        var spinDuration = durationValue(randomFloat(4, 8));
        /* Set the -webkit-animation-duration property with these values */
        leafDiv.style.webkitAnimationDuration = fadeAndDropDuration + ', ' + fadeAndDropDuration;

        var leafDelay = durationValue(randomFloat(0, 5));
        leafDiv.style.webkitAnimationDelay = leafDelay + ', ' + leafDelay;

        image.style.webkitAnimationDuration = spinDuration;

        // add the <img> to the <div>
        leafDiv.appendChild(image);

        /* Return this img element so it can be added to the document */
        return leafDiv;
    }


    /* Calls the init function when the "Falling Leaves" page is full loaded */
    window.addEventListener('load', initLeaves, false);
  </script>
