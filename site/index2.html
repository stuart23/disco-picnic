<html lang="en"><head>
  <style>
    body {
      margin: 0;
      padding: 0;
    }
		#canvas {
			display: block;
			width: 100%;
			height: 100%;
		}

    .falling {
      width: 100vh
      height: 0
    }

    .falling span {
      display: inline-block;
      width: 250px;
      height: 250px;
      margin: -500px 40px 54px -34px;
      background:url('table.png');

      -webkit-animation: falling 20s infinite linear;
      -moz-animation: falling 20s infinite linear;
    }

    .falling span:nth-child(5n+5) {

      -webkit-animation-delay: 1s;
      -moz-animation-delay: 1s;
    }
    .falling span:nth-child(3n+2) {

      -webkit-animation-delay: 3s;
      -moz-animation-delay: 3s;
    }
    .falling span:nth-child(2n+5) {

      -webkit-animation-delay: 3.4s;
      -moz-animation-delay: 3.4s;
    }

    .falling span:nth-child(3n+10) {

      -webkit-animation-delay: 5.4s;
      -moz-animation-delay: 5.4s;
    }
    .falling span:nth-child(7n+2) {

      -webkit-animation-delay: 7s;
      -moz-animation-delay: 7s;
    }
    .falling span:nth-child(4n+5) {

      -webkit-animation-delay: 11s;
      -moz-animation-delay: 11s;
    }
    .falling span:nth-child(3n+7) {

      -webkit-animation-delay: 16s;
      -moz-animation-delay: 16s;
    }

    @-webkit-keyframes falling {
      0% {
        width: 250px;
        height: 250px;
        opacity: 1;

    	-webkit-transform: translate(0, 0px) rotateZ(0deg);
      }
      20% {
        width: 250px;
        height: 250px;
        opacity: 1;

    	-webkit-transform: translate(40px, 160px) rotateZ(270deg);
      }
      40% {
        width: 250px;
        height: 250px;
        opacity: 1;

    	-webkit-transform: translate(80px, 320px) rotateZ(180deg);
      }
      60% {
        width: 250px;
        height: 250px;
        opacity: 1;

    	-webkit-transform: translate(120px, 480px) rotateZ(90deg);
      }
      80% {
        width: 250px;
        height: 250px;
        opacity: 1;

    	-webkit-transform: translate(160px, 640px) rotateZ(135deg);
      }
      100% {
        width: 250px;
        height: 250px;
        opacity: 1;

    	-webkit-transform: translate(200px, 800px) rotateZ(315deg);
      }
    }
    @-moz-keyframes falling {
      0% {
        width: 250px;
        height: 250px;
        opacity: 1;

    	-webkit-transform: translate(0, 0px) rotateZ(0deg);
      }
      20% {
        width: 250px;
        height: 250px;
        opacity: 1;

    	-webkit-transform: translate(40px, 160px) rotateZ(270deg);
      }
      40% {
        width: 250px;
        height: 250px;
        opacity: 1;

    	-webkit-transform: translate(80px, 320px) rotateZ(180deg);
      }
      60% {
        width: 250px;
        height: 250px;
        opacity: 1;

    	-webkit-transform: translate(120px, 480px) rotateZ(90deg);
      }
      80% {
        width: 250px;
        height: 250px;
        opacity: 1;

    	-webkit-transform: translate(160px, 640px) rotateZ(135deg);
      }
      100% {
        width: 250px;
        height: 250px;
        opacity: 1;

    	-webkit-transform: translate(200px, 800px) rotateZ(315deg);
      }
    }

<body>
  <script type="module">
    import * as THREE from 'https://threejs.org/build/three.module.js';
    import { OrbitControls } from 'https://threejs.org/examples/jsm/controls/OrbitControls.js';
    var mesh, renderer, scene, camera;
    init();
    render();
    function init() {
      scene = new THREE.Scene();
			scene.background = new THREE.Color( 0xffffff );

      renderer = new THREE.WebGLRenderer();
			renderer.setPixelRatio( window.devicePixelRatio );
			renderer.setSize( window.innerWidth, window.innerHeight );
      document.body.appendChild( renderer.domElement );

      var lights = [];
      lights[ 0 ] = new THREE.PointLight( 0xffffff, 1, 0 );
      lights[ 1 ] = new THREE.PointLight( 0xffffff, 1, 0 );
      lights[ 2 ] = new THREE.PointLight( 0xffffff, 1, 0 );

      lights[ 0 ].position.set( 0, 200, 0 );
      lights[ 1 ].position.set( 100, 200, 100 );
      lights[ 2 ].position.set( - 100, - 200, - 100 );

      scene.add( lights[ 0 ] );
      scene.add( lights[ 1 ] );
      scene.add( lights[ 2 ] );

      camera = new THREE.PerspectiveCamera( 60, window.innerWidth / window.innerHeight, 1, 1000 );
      camera.position.set( 10, 15, 25 );
      camera.setViewOffset(window.innerWidth, window.innerHeight, window.innerWidth/3, -window.innerHeight/4, window.innerWidth, window.innerHeight)
      // camera.filmOffset = 0.3 * camera.getFilmWidth();

      camera.updateProjectionMatrix();

      scene.add( camera );
      var controls = new OrbitControls( camera, renderer.domElement );
      controls.addEventListener( 'change', render );

      const radius = 12;
      const widthSegments = 24;
      const heightSegments = 16;
      const geometry = new THREE.SphereBufferGeometry(radius, widthSegments, heightSegments);

      var picture_array = [
        "db.jpg",
        "dq.png",
        "gt.png",
        "km.jpg",
        "ok.jpg",
        "pk.png",
        "sb.png",
      ];

      var random_pic = picture_array[Math.floor(Math.random()*picture_array.length)];
      var texture = new THREE.TextureLoader().load( random_pic, render );
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set( 24, 16 );
      var material = new THREE.MeshPhongMaterial( { map: texture, emissive: 0x000000, flatShading: false } );
      var sphere = new THREE.Mesh( geometry, material );
      scene.add( sphere );
      window.addEventListener( 'resize', onWindowResize, false );
    }
    function render() {
      renderer.render( scene, camera );
    }
    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize( window.innerWidth, window.innerHeight );
      render();
    }
  </script>
